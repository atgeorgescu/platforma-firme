services:
  - type: web
    name: platforma-firme
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: platforma-firme-db
          property: connectionString
databases:
  - name: platforma-firme-db
    plan: free
    region: frankfurt
